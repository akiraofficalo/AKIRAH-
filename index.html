<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKIRAH 🪽</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #101010; color: #eee; font-family: Arial, sans-serif; text-align: right; }
        header { padding: 22px 7%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .logo { font-size: 30px; font-weight: 900; letter-spacing: 7px; }
        nav a { color: white; text-decoration: none; margin-left: 20px; font-size: 13px; }
        .hero { min-height: 250px; display: flex; flex-direction: column; justify-content: center; padding: 50px 9%; background: linear-gradient(90deg,#080808,#252020); }
        .hero h1 { font-size: clamp(48px, 10vw, 90px); letter-spacing: 8px; }
        section { padding: 65px 7%; }
        h2 { font-size: 30px; letter-spacing: 4px; margin-bottom: 30px; }
        .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 25px; }
        .product { background: #1b1b1b; padding: 12px; }
        .product img { width: 100%; height: 270px; object-fit: cover; background: #292929; }
        .product h3 { margin: 15px 0 8px; }
        .product p { color: #aaa; margin-bottom: 15px; }
        footer { text-align: center; padding: 35px; color: #777; border-top: 1px solid #333; }
        .empty-msg { font-size: 20px; color: #ff4444; font-weight: bold; margin: 20px 0; }
    </style>
</head>
<body>

    <header>
        <div class="logo">AKIRAH 🪽</div>
        <nav>
            <a href="admin.html">Admin</a>
        </nav>
    </header>

    <div class="hero">
        <h1>AKIRAH 🪽</h1>
    </div>

    <section>
        <h2>السلع المتوفرة</h2>
        <div id="products-grid" class="products">
            جاري تحميل السلع...
        </div>
    </section>

    <footer>
        <p>&copy; 2026 AKIRAH 🪽. All rights reserved.</p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://mcgojcrqthtowagnffdk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_zyq8Nm5IHnjl7u9mHReORw_0suR_B07';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadStoreProducts() {
            const { data, error } = await supabaseClient.from('products').select('*');
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';

            if (error || !data || data.length === 0) {
                grid.innerHTML = '<div class="empty-msg">سير تحوا أزبي راه مزل مكاين الحويج</div>';
                return;
            }

            data.forEach(p => {
                grid.innerHTML += `
                    <div class="product">
                        <img src="${p.img || ''}" alt="${p.name}">
                        <h3>${p.name}</h3>
                        <p>${p.price} MAD</p>
                    </div>
                `;
            });
        }

        loadStoreProducts();
    </script>

</body>
</html>

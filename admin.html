<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>متجر AKIRAH</title>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f4f4; padding: 20px; text-align: right; }
        .container { background: white; padding: 20px; border-radius: 8px; max-width: 600px; margin: auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background: #000; color: #fff; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #333; }
        .product-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 6px; background: #fafafa; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🛍️ منتجات المتجر</h2>
        <div id="products-list">جاري تحميل المنتجات...</div>
    </div>

    <!-- نافذة إتمام الطلب -->
    <div class="container" id="checkout-section">
        <h2>📦 تأكيد الطلبية</h2>
        <input type="text" id="c-name" placeholder="الاسم الكامل">
        <input type="text" id="c-phone" placeholder="رقم الهاتف">
        <input type="text" id="c-address" placeholder="العنوان ورقم المدينة">
        
        <input type="hidden" id="selected-product-name" value="منتج عام">
        <input type="hidden" id="selected-product-price" value="0">
        
        <p>السلعة المختارة: <strong id="display-product">اختر سلعة من الفوق</strong></p>
        
        <button onclick="submitOrder()">تأكيد الشراء الآن</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://mcgojcrqthtowagnffdk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_zyq8Nm5IHnjl7u9mHReORw_0suR_B07';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // جلب المنتجات وعرضها للزبون
        async function loadPublicProducts() {
            const { data } = await supabaseClient.from('products').select('*');
            const listContainer = document.getElementById('products-list');
            listContainer.innerHTML = '';
            
            if (!data || data.length === 0) {
                listContainer.innerHTML = 'ما كاينا حتى سلعة متوفرة حالياً.';
                return;
            }

            data.forEach(p => {
                listContainer.innerHTML += `
                    <div class="product-card">
                        <h3>${p.name}</h3>
                        <p>${p.description || ''}</p>
                        <p style="color:green; font-weight:bold;">${p.price} درهم</p>
                        <button onclick="selectProduct('${p.name}', ${p.price})">اختر هذه السلعة للطلب</button>
                    </div>
                `;
            });
        }

        // اختيار سلعة للطلب
        function selectProduct(name, price) {
            document.getElementById('selected-product-name').value = name;
            document.getElementById('selected-product-price').value = price;
            document.getElementById('display-product').innerText = `${name} (${price} درهم)`;
            alert(`تم اختيار: ${name}`);
        }

        // إرسال الطلبية لـ Supabase
        async function submitOrder() {
            const customer_name = document.getElementById('c-name').value;
            const customer_phone = document.getElementById('c-phone').value;
            const customer_address = document.getElementById('c-address').value;
            const product_name = document.getElementById('selected-product-name').value;
            const total_price = parseFloat(document.getElementById('selected-product-price').value);

            if (!customer_name || !customer_phone || !customer_address) {
                alert('عمر معلوماتك كاملة (الاسم، الهاتف، والعنوان)!');
                return;
            }

            const { error } = await supabaseClient.from('orders').insert([
                { customer_name, customer_phone, customer_address, product_name, total_price }
            ]);

            if (!error) {
                alert('تمت طلبيتك بنجاح! شكرا لك.');
                document.getElementById('c-name').value = '';
                document.getElementById('c-phone').value = '';
                document.getElementById('c-address').value = '';
            } else {
                alert('حدث خطأ أثناء إرسال الطلبية، عاود المحاولة.');
            }
        }

        loadPublicProducts();
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم - AKIRAH Admin 🪽</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #101010; color: #eee; padding: 20px; text-align: right; }
        .admin-box, .panel { background: #1b1b1b; padding: 20px; border-radius: 8px; max-width: 700px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-bottom: 20px; border: 1px solid #333; }
        .hidden { display: none; }
        input, button { padding: 12px; margin: 8px 0; width: 100%; box-sizing: border-box; background: #222; color: white; border: 1px solid #555; }
        button { background: #eee; color: #111; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #ccc; }
        .item-row, .order-row { border-bottom: 1px solid #333; padding: 12px 0; margin-bottom: 10px; }
        .order-row { background: #161616; padding: 15px; border-radius: 6px; border: 1px solid #333; }
        .delete-btn { background: #ff4444; color: white; width: auto; padding: 6px 12px; margin-top: 5px; }
        .admin-img-preview { width: 50px; height: 50px; object-fit: cover; vertical-align: middle; margin-left: 10px; background: #292929; }
    </style>
</head>
<body>

    <!-- مرحلة إدخال الكود السري -->
    <div id="login-screen" class="admin-box">
        <h2>دخول المسؤول (Admin) 🪽</h2>
        <input type="password" id="admin-pass" placeholder="أدخل الكود السري الخاص بك">
        <button onclick="checkPassword()">دخول</button>
    </div>

    <!-- لوحة التحكم -->
    <div id="admin-panel" class="hidden">
        
        <!-- قسم الطلبيات -->
        <div class="panel">
            <h2>📦 الطلبيات الواردة (Orders)</h2>
            <div id="admin-orders-list">جاري تحميل الطلبيات...</div>
        </div>

        <!-- قسم إدارة المنتجات وتصاورهم -->
        <div class="panel">
            <h2>🛒 إدارة المنتجات والتصاور</h2>
            <h3>إضافة منتج جديد مع التصويرة</h3>
            <input type="text" id="p-name" placeholder="اسم السلعة (مثلاً: Dark Tee)">
            <input type="number" id="p-price" placeholder="الثمن بالدرهم">
            <input type="text" id="p-img" placeholder="رابط التصويرة (Image URL)">
            <button onclick="addProduct()">إضافة السلعة للموقع</button>

            <hr style="margin: 20px 0; border-color: #333;">

            <h3>السلع الحالية في الموقع</h3>
            <div id="admin-products-list">جاري التحميل...</div>
        </div>

    </div>

    <script>
        const MY_SECRET_CODE = "akirah2026";
        const SUPABASE_URL = 'https://mcgojcrqthtowagnffdk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_zyq8Nm5IHnjl7u9mHReORw_0suR_B07';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function checkPassword() {
            const enteredPass = document.getElementById('admin-pass').value;
            if (enteredPass === MY_SECRET_CODE) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadAdminProducts();
                loadAdminOrders();
            } else {
                alert('الكود خطأ!');
            }
        }

        async function loadAdminOrders() {
            const { data, error } = await supabaseClient.from('orders').select('*').order('id', { ascending: false });
            const ordersContainer = document.getElementById('admin-orders-list');
            ordersContainer.innerHTML = '';
            
            if (error || !data || data.length === 0) {
                ordersContainer.innerHTML = 'ما كاينا حتى طلبيّة حالياً.';
                return;
            }

            data.forEach(o => {
                ordersContainer.innerHTML += `
                    <div class="order-row">
                        <p><strong>👤 الاسم:</strong> ${o.customer_name || 'غير محدد'}</p>
                        <p><strong>📞 الهاتف:</strong> ${o.customer_phone || 'غير محدد'}</p>
                        <p><strong>📍 العنوان:</strong> ${o.customer_address || 'غير محدد'}</p>
                        <p><strong>🛍️ السلعة:</strong> ${o.product_name || 'منتج'} (<span style="color:#4ecc50;">${o.total_price || 0} MAD</span>)</p>
                        <button class="delete-btn" onclick="deleteOrder(${o.id})">حذف الطلبية</button>
                    </div>
                `;
            });
        }

        async function deleteOrder(id) {
            if (confirm('واش متأكد بغيتي تمسح هاد الطلبية؟')) {
                const { error } = await supabaseClient.from('orders').delete().eq('id', id);
                if (!error) {
                    loadAdminOrders();
                } else {
                    alert('خطأ في الحذف.');
                }
            }
        }

        async function loadAdminProducts() {
            const { data } = await supabaseClient.from('products').select('*');
            const listContainer = document.getElementById('admin-products-list');
            listContainer.innerHTML = '';
            
            if (!data || data.length === 0) {
                listContainer.innerHTML = 'sir thwa rah mazal makina sl3a';
                return;
            }

            data.forEach(p => {
                listContainer.innerHTML += `
                    <div class="item-row" style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <img src="${p.img || ''}" class="admin-img-preview" alt="">
                            <strong>${p.name}</strong> - <span style="color:#4ecc50;">${p.price} MAD</span>
                        </div>
                        <button class="delete-btn" onclick="deleteProduct(${p.id})">حذف</button>
                    </div>
                `;
            });
        }

        async function addProduct() {
            const name = document.getElementById('p-name').value;
            const price = parseFloat(document.getElementById('p-price').value);
            const img = document.getElementById('p-img').value;

            if (!name || !price) {
                alert('عمر اسم السلعة والثمن على الأقل!');
                return;
            }

            const { error } = await supabaseClient.from('products').insert([{ name, price, img }]);

            if (!error) {
                alert('تمت إضافة السلعة بنجاح!');
                document.getElementById('p-name').value = '';
                document.getElementById('p-price').value = '';
                document.getElementById('p-img').value = '';
                loadAdminProducts();
            } else {
                alert('حدث خطأ أثناء الإضافة.');
            }
        }

        async function deleteProduct(id) {
            if (confirm('واش متأكد بغيتي تمسح هاد السلعة؟')) {
                const { error } = await supabaseClient.from('products').delete().eq('id', id);
                if (!error) {
                    loadAdminProducts();
                } else {
                    alert('خطأ في الحذف.');
                }
            }
        }
    </script>

</body>
</html>
